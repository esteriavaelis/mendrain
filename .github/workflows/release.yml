name: Release

# Pushing a tag such as v1.0.0 (or v1.1.0-preview.1) builds Mendrain with Velopack and creates a DRAFT
# GitHub Release with the installer, the portable ZIP and the update feed attached. Nothing is published,
# and no installed copy sees the update, until the owner reviews the draft and clicks "Publish release".
# "Run workflow" (workflow_dispatch) builds the same packages as downloadable workflow artifacts only.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $v = $env:GITHUB_REF_NAME.TrimStart("v")
            if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Tag '$env:GITHUB_REF_NAME' must look like v1.2.3 or v1.2.3-preview.1." }
          } else {
            [xml]$proj = Get-Content src/Mendrain/Mendrain.csproj
            $v = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Package (tests, publish, Velopack)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # -PreviousFromGitHub downloads the latest published release so Velopack can build a delta update.
        run: ./tools/package.ps1 -Version "${{ steps.version.outputs.version }}" -PreviousFromGitHub

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mendrain-${{ steps.version.outputs.version }}
          path: |
            artifacts/Mendrain-Setup-x64.exe
            artifacts/Mendrain-Portable-x64.zip
            artifacts/SHA256SUMS.txt
            artifacts/releases/
          if-no-files-found: error

      - name: Create draft GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $pre = @()
          if ($v -match '-') { $pre = @("--pre") }
          # Velopack uploads the update feed (releases.win.json and packages) to a draft release.
          dotnet vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --token $env:GH_TOKEN `
            --tag $env:GITHUB_REF_NAME --releaseName "Mendrain $v" -o artifacts/releases @pre
          if ($LASTEXITCODE -ne 0) { throw "vpk upload github failed." }
          # Friendly download names (the same as earlier releases) and checksums.
          gh release upload $env:GITHUB_REF_NAME artifacts/Mendrain-Setup-x64.exe artifacts/Mendrain-Portable-x64.zip artifacts/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw "Uploading the installer failed." }
          foreach ($duplicate in @("MendrainApp-win-Setup.exe", "MendrainApp-win-Portable.zip")) {
            gh release delete-asset $env:GITHUB_REF_NAME $duplicate --yes
          }
          gh release edit $env:GITHUB_REF_NAME --notes-file artifacts/release-notes.md
